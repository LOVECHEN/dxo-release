name: Daily DxO Mirror
# 把 DxO 全家桶 macOS 官方安装包镜像到 GitHub Releases。
# 官方直链存在仓库 Secret DXO_URLS 里(每行 "key|显示名|URL"),日志自动 ::add-mask:: 打码,不落入公开代码。
# 点版本号在 dmg 内部(APFS/HFS 混用,CI 无法可靠读取),故用官方文件的更新日期(Last-Modified)标记版本;
# 资产保留官方原始文件名。超过 GitHub 单文件 2GiB 上限的自动分卷。

on:
  schedule:
    - cron: "0 6 * * *"   # 每天 06:00 UTC = 北京 14:00
  workflow_dispatch:
    inputs:
      only:
        description: "仅处理某产品 key (photolab9/filmpack8/viewpoint5/pureraw6/nikcollection9/all)"
        required: false
        default: "all"
      force:
        description: "强制重镜像(即使该日期 tag 已存在)"
        required: false
        default: "false"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: dxo-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Mirror
        env:
          DXO_URLS: ${{ secrets.DXO_URLS }}
          ONLY: ${{ github.event.inputs.only || 'all' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -uo pipefail
          [ -n "${DXO_URLS:-}" ] || { echo "::error::Secret DXO_URLS 未设置(每行 key|显示名|URL)"; exit 1; }
          LIMIT=$((1900*1024*1024))   # >~1.9GiB 就分卷(GitHub 单文件上限 2GiB)

          printf '%s\n' "$DXO_URLS" | while IFS='|' read -r KEY NAME URL; do
            KEY=$(echo "$KEY"  | xargs); [ -n "$KEY" ] || continue
            NAME=$(echo "$NAME" | xargs)
            URL=$(echo "$URL"  | xargs); [ -n "$URL" ] || continue
            # 遮蔽:完整 URL + 主机名 都打码(不单单域名),即使某处只露出一部分也被 *** 掉
            echo "::add-mask::$URL"
            HOST=$(printf '%s' "$URL" | sed -E 's~^[a-zA-Z]+://([^/]+).*~\1~')
            [ -n "$HOST" ] && [ "$HOST" != "$URL" ] && echo "::add-mask::$HOST"
            if [ "$ONLY" != "all" ] && [ "$ONLY" != "$KEY" ]; then echo "⏭ 跳过 $KEY"; continue; fi

            echo "═══ $KEY ($NAME) ═══"
            # 只读响应头拿 Last-Modified(1 字节 range GET,兼容 CDN)
            hdr=$(curl -fsSL --retry 3 --max-time 60 -D - -o /dev/null -r 0-0 "$URL" 2>/dev/null || true)
            lm=$(printf '%s\n' "$hdr" | grep -i '^last-modified:' | head -1 | tr -d '\r' | sed -E 's/^[^:]*:[[:space:]]*//')
            if [ -n "$lm" ]; then
              STAMP=$(date -u -d "$lm" +%Y%m%d 2>/dev/null || date -u +%Y%m%d)
              DATE=$(date -u -d "$lm" +%Y-%m-%d 2>/dev/null || date -u +%Y-%m-%d)
            else
              STAMP=$(date -u +%Y%m%d); DATE=$(date -u +%Y-%m-%d)
            fi
            TAG="${KEY}-${STAMP}"
            TITLE="${NAME} · ${DATE}"

            if [ "$FORCE" != "true" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "  ⏭ $TAG 已存在,跳过"; continue
            fi

            fname=$(basename "${URL%%\?*}")
            DIR="rel-$TAG"; rm -rf "$DIR"; mkdir -p "$DIR"
            echo "  📥 下载 $fname ..."
            if ! curl -fL --retry 4 --retry-delay 5 --connect-timeout 30 -o "$DIR/$fname" "$URL" 2>/dev/null; then
              echo "  ❌ 下载失败,跳过"; rm -rf "$DIR"; continue
            fi

            realsize=$(stat -c%s "$DIR/$fname")
            human=$(numfmt --to=iec --suffix=B "$realsize")
            orig_sha=$(sha256sum "$DIR/$fname" | awk '{print $1}')

            SPLIT_NOTE=""
            if [ "$realsize" -gt "$LIMIT" ]; then
              echo "  ✂️ >2GiB,分卷..."
              ( cd "$DIR" && split -b 1900m -d --additional-suffix=".part" "$fname" "${fname}." && rm -f "$fname" )
              SPLIT_NOTE=$(printf '> ⚠️ 该安装包超过 GitHub 单文件 2GiB 上限,已分卷。请下载**全部** `%s.NN.part` 后合并:\n>\n> ```bash\n> cat %s.*.part > %s\n> shasum -a 256 %s   # 应为 %s\n> ```' "$fname" "$fname" "$fname" "$fname" "$orig_sha")
            fi

            ( cd "$DIR" && sha256sum * > checksums.sha256 )

            NOTES="notes-$TAG.md"
            {
              echo "## $TITLE"; echo
              echo "🍎 macOS 官方安装包 · 更新日期 **$DATE** · 大小 $human"; echo
              if [ -n "$SPLIT_NOTE" ]; then echo "$SPLIT_NOTE"; echo; fi
              echo "### 完整包 SHA-256"
              echo '```'
              echo "$orig_sha  $fname"
              echo '```'
              echo
              echo "---"
              echo "> 🤖 自动镜像于 $(date -u '+%Y-%m-%d %H:%M UTC') · 官方原始安装包,未做任何修改。"
            } > "$NOTES"

            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" "$DIR"/*
            echo "  ✅ 已发布 $TAG"
            rm -rf "$DIR" "$NOTES"
          done

  # public repo 的 schedule 在仓库 60 天无提交活动后会被 GitHub 自动禁用。
  # DxO 更新不频繁,距上次提交 >50 天时推一个空提交兜底。
  keepalive:
    runs-on: ubuntu-latest
    needs: mirror
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if repo near inactivity threshold
        run: |
          LAST=$(git log -1 --format=%ct); NOW=$(date +%s); DAYS=$(( (NOW-LAST)/86400 ))
          echo "距上次提交 ${DAYS} 天"
          if [ "$DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — 防 schedule 因 60 天不活跃被禁用"
            git push
            echo "✅ 已推空提交保活"
          else
            echo "⏭ 无需 keepalive (< 50 天)"
          fi
